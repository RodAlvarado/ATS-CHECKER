    <meta property="og:title" content="ATS Checker - USA PLACEMENT PROGRAM" />
    <meta property="og:description" content="Evalúa si un CV de LATAM pasará los filtros ATS y humanos para puestos remotos en EE.UU., ofreciendo feedback accionable y optimización de palabras clave." />
    <script>
      // Ensure window.fetch has a setter so iframe tools or proxies can wrap it without throwing
      try {
        let _customFetch = window.fetch.bind(window);
        Object.defineProperty(window, 'fetch', {
          get() {
            return _customFetch;
          },
          set(val) {
            _customFetch = val;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Fallback if property is already frozen
      }
    </script>

    <div id="root"></div>

  </body>
